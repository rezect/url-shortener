services:
  postgres:
    image: postgres:16
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shortener
      SERVER_PORT: 8000
    container_name: backend
    ports:
      - "6767:8000"
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data: